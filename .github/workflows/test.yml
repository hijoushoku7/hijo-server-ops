name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.gif"
      - "**.png"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.gif"
      - "**.png"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
