name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.gif"
      - "**.png"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.gif"
      - "**.png"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # 既定のキャッシュは go.sum のハッシュだけをキーにする。go.sum が
          # 変わらない限り新しく保存されないので、リポジトリ自身のビルド結果と
          # テスト結果が毎回捨てられる。下の actions/cache で自前で持つ。
          cache: false

      - name: キャッシュディレクトリの取得
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.mod }}
          # キーに SHA を入れて毎回 miss させ、その回の成果を必ず保存する。
          # 復元は restore-keys で直近のものに前方一致でフォールバックする。
          # deps job とは別の名前空間にする（同じ SHA で保存が衝突するため）。
          key: go-test-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ hashFiles('go.mod') }}-
            go-test-${{ runner.os }}-

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
      - name: go test -tags en
        run: go test -tags en ./...
